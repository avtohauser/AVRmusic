# Deploys the current branch to the production server over SSH. The runner copies the source tree,
# so the server needs no access to this (private) repository.
# Repository secrets: SERVER_HOST (IP or domain), SERVER_USER (root), SERVER_PASSWORD (or SERVER_SSH_KEY).
# Repository variable: DOMAIN (e.g. music.avthsr.space). Runs on push to the deploy branch or manually.
name: deploy
on:
  push:
    branches: [claude/music-service-streaming-nfpgvx, main]
  workflow_dispatch:
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host and user
        env:
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # Secrets are often pasted with labels or stray whitespace ("IP: 1.2.3.4", "root@host", a
          # trailing newline). Extract the first IP/hostname; fall back to DOMAIN when it does not resolve.
          pick_host() { printf '%s' "$1" | tr -d '\r' | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | head -n1 || true; }
          host="$(pick_host "$RAW_HOST")"
          if [ -z "$host" ] || ! getent ahostsv4 "$host" >/dev/null 2>&1; then
            echo "::warning::SERVER_HOST is empty or does not resolve, deploying to DOMAIN instead"
            host="$(pick_host "$DOMAIN")"
          fi
          getent ahostsv4 "$host" >/dev/null 2>&1 || { echo "::error::cannot resolve target host"; exit 1; }
          user="$(printf '%s' "$RAW_USER" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/.*[[:space:]:=]//; s/@.*//')"
          # The DOMAIN variable may have been pasted as "DOMAIN=music.example.com".
          domain="$(pick_host "$DOMAIN")"
          [ -n "$domain" ] || { echo "::error::DOMAIN variable does not contain a hostname"; exit 1; }
          echo "TARGET_HOST=$host" >> "$GITHUB_ENV"
          echo "TARGET_USER=${user:-root}" >> "$GITHUB_ENV"
          echo "TARGET_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "Deploying to $domain"
          # The server gets a plain source tree (no clone), so the installer never talks to GitHub.
          rm -rf .git

      - name: Check SSH credentials
        env:
          RAW_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set +e
          if [ -n "$SSH_KEY" ]; then echo "Using SERVER_SSH_KEY"; exit 0; fi
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq sshpass >/dev/null; }
          # SERVER_PASSWORD may have been pasted with a label ("Пароль: xxx") or a trailing newline.
          # Try the sensible variants and keep the one the server accepts (masked in the logs).
          cands=()
          add() { local v="$1" c; [ -n "$v" ] || return 0; for c in "${cands[@]}"; do [ "$c" = "$v" ] && return 0; done; cands+=("$v"); }
          add "$RAW_PASSWORD"
          t="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"; add "$t"
          t="$(printf '%s' "$t" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"; add "$t"
          add "$(printf '%s' "$t" | sed -E 's/^[^:]*:[[:space:]]*//')"
          add "$(printf '%s' "$t" | sed -E 's/^[A-Za-z_]+=//')"
          add "${t##* }"
          for c in "${cands[@]}"; do
            [ "$c" = "$RAW_PASSWORD" ] || echo "::add-mask::$c"
            if SSHPASS="$c" timeout 45 sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
                 -o ConnectTimeout=20 -o LogLevel=ERROR "$TARGET_USER@$TARGET_HOST" true 2>/tmp/ssh.err; then
              { echo "TARGET_PASSWORD<<__EOF__"; printf '%s\n' "$c"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "SSH login OK"; exit 0
            fi
          done
          echo "--- last ssh error:"; cat /tmp/ssh.err
          echo "::error::The server rejected SERVER_PASSWORD for $TARGET_USER@$TARGET_HOST. Check the secret (only the password, no label), that the root password was not changed, and that sshd allows root password login (PermitRootLogin yes / PasswordAuthentication yes)."
          echo "::error::Сервер отверг пароль. Проверьте секрет SERVER_PASSWORD (только сам пароль, без подписи), не менялся ли пароль root, и разрешён ли вход root по паролю в sshd."
          exit 1

      - name: Copy source to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.TARGET_HOST }}
          username: ${{ env.TARGET_USER }}
          password: ${{ env.TARGET_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: /opt/avrmusic
          rm: false
          overwrite: true

      - name: Install / update and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.TARGET_HOST }}
          username: ${{ env.TARGET_USER }}
          password: ${{ env.TARGET_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            export APP_DIR=/opt/avrmusic BRANCH="${{ github.ref_name }}" DOMAIN="${{ env.TARGET_DOMAIN }}"
            bash /opt/avrmusic/deploy/install.sh "$DOMAIN"
            echo "==> Waiting for https://$DOMAIN/api/health"
            for i in $(seq 1 36); do
              # public URL first; the --resolve variant sidesteps hairpin-NAT on the VPS itself
              if curl -fsS -m 5 "https://$DOMAIN/api/health" || curl -fsS -m 5 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/health"; then
                echo; echo "==> AVRmusic is live: https://$DOMAIN"
                echo "==> Served build: $(curl -s -m 5 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1)"; exit 0
              fi
              sleep 5
            done
            echo "::error::service did not become healthy"; cd /opt/avrmusic
            docker compose -f docker-compose.prod.yml ps; docker compose -f docker-compose.prod.yml logs --tail 80; exit 1

      # Dry run of the acquisition matcher on the server (real catalogue + YouTube) for the songs listed in
      # deploy/acquire-check.txt: shows which upload each version (solo / feat. …) would get and why.
      - name: Acquisition self-check
        if: ${{ hashFiles('deploy/acquire-check.txt') != '' && env.TARGET_PASSWORD != '' }}
        continue-on-error: true
        env:
          SSHPASS: ${{ env.TARGET_PASSWORD }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq sshpass >/dev/null; }
          while IFS= read -r q || [ -n "$q" ]; do
            q="${q%%#*}"; q="$(printf '%s' "$q" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"; [ -z "$q" ] && continue
            echo "::group::$q"
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$TARGET_USER@$TARGET_HOST" \
              "cd /opt/avrmusic && timeout 900 docker compose -f docker-compose.prod.yml exec -T avrmusic node /app/api/dist/scripts/acquire-check.js $(printf '%q' "$q") --audio" || echo "(check failed)"
            echo "::endgroup::"
          done < deploy/acquire-check.txt
