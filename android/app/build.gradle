plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

// CI passes the version (package.json version + build number) and the signing key through the environment.
def versionCodeEnv = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
def versionNameEnv = System.getenv('APP_VERSION_NAME') ?: '0.1.0'
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
  namespace 'space.avthsr.music'
  compileSdk 36

  defaultConfig {
    applicationId 'space.avthsr.music'
    minSdk 23
    targetSdk 34
    versionCode versionCodeEnv
    versionName versionNameEnv
  }

  signingConfigs {
    release {
      if (keystoreFile) {
        storeFile file(keystoreFile)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS') ?: 'avrmusic'
        keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      // R8: Compose and the other libraries run much faster optimized (the app's own code is kept as is)
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (keystoreFile) signingConfig signingConfigs.release
    }
  }

  buildFeatures { buildConfig true; compose true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

kotlin {
  compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

dependencies {
  // the app itself (screens, API, queue, offline …) lives in :shared, with Compose Multiplatform;
  // here: the Media3 player service (ExoPlayer in a media session: shade player with ♥) and the activity
  implementation project(':shared')
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
  implementation 'androidx.media3:media3-datasource:1.4.1'
  implementation 'androidx.media3:media3-database:1.4.1'
  // music on a Chromecast / TV / speaker with Google Cast
  implementation 'androidx.media3:media3-cast:1.4.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2'
  // animated canvases (GIF / animated WebP)
  implementation 'io.coil-kt.coil3:coil-gif:3.3.0'
}
