# XcodeGen spec of the iOS app (CI runs `xcodegen generate`; the .xcodeproj is not kept in git).
# The Kotlin side is built by Gradle from the "Compile Kotlin" phase into shared/build/xcode-frameworks.
name: AVRmusic
options:
  bundleIdPrefix: space.avthsr
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
targets:
  AVRmusic:
    type: application
    platform: iOS
    sources:
      - path: AVRmusic
      # the same two variable fonts the Android app carries
      - path: ../shared/src/androidMain/res/font
        buildPhase: resources
    info:
      path: AVRmusic/Info.plist
      properties:
        CFBundleDisplayName: AVRmusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Compose Multiplatform draws at the display's full rate (120 Hz on ProMotion) and checks this key
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # music keeps playing with the screen off; news are checked in the background
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [space.avthsr.music.news]
        # downloaded tracks and albums show in Files → On My iPhone → AVRmusic
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: AVRmusic берёт фото для аватара и обложек
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: space.avthsr.music
            CFBundleURLSchemes: [avrmusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.avthsr.music
        PRODUCT_NAME: AVRmusic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    preBuildScripts:
      - name: Compile Kotlin
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          "${GRADLE_BIN:-gradle}" :shared:embedAndSignAppleFrameworkForXcode --console=plain
