plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

// CI passes the version (package.json version + build number) and the signing key through the environment.
def versionCodeEnv = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
def versionNameEnv = System.getenv('APP_VERSION_NAME') ?: '0.1.0'
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
  namespace 'space.avthsr.music'
  compileSdk 34

  defaultConfig {
    applicationId 'space.avthsr.music'
    minSdk 21
    targetSdk 34
    versionCode versionCodeEnv
    versionName versionNameEnv
  }

  signingConfigs {
    release {
      if (keystoreFile) {
        storeFile file(keystoreFile)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS') ?: 'avrmusic'
        keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (keystoreFile) signingConfig signingConfigs.release
    }
  }

  buildFeatures { buildConfig true; compose true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  // native UI: Jetpack Compose + Material 3; music: ExoPlayer in a Media3 session service (shade player with ♥)
  implementation platform('androidx.compose:compose-bom:2024.10.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.animation:animation'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.navigation:navigation-compose:2.8.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
  implementation 'androidx.media3:media3-datasource:1.4.1'
  implementation 'androidx.media3:media3-database:1.4.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'io.coil-kt:coil-compose:2.7.0'
}
