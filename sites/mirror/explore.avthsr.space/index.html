    <style>
        :root {
            --bg: #053135;
            --text: #E8F0F0;
            --text-muted: rgba(232, 240, 240, 0.72);
            --text-faint: rgba(232, 240, 240, 0.55);
            --surface: rgba(255, 255, 255, 0.04);
            --surface-border: rgba(255, 255, 255, 0.10);
            --tile: rgba(255, 255, 255, 0.02);
            --tile-border: rgba(255, 255, 255, 0.06);
            --tile-hover: rgba(255, 255, 255, 0.06);
            --glow: radial-gradient(circle, rgba(232, 156, 159, 0.10) 0%, rgba(9, 58, 62, 0) 60%);
            --accent: #EAA1A2;
            --accent-2: #8E54E9;
            --ctrl-bg: rgba(255, 255, 255, 0.06);
            --ctrl-bg-hover: rgba(255, 255, 255, 0.14);
            --ctrl-border: rgba(255, 255, 255, 0.12);
            --scroll-thumb: rgba(255, 255, 255, 0.12);
        }

        html.theme-dark {
            --bg: #060709;
            --text: #ECECEC;
            --text-muted: rgba(236, 236, 236, 0.68);
            --text-faint: rgba(236, 236, 236, 0.45);
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.10);
            --tile: rgba(255, 255, 255, 0.03);
            --tile-border: rgba(255, 255, 255, 0.07);
            --tile-hover: rgba(255, 255, 255, 0.08);
            --glow: radial-gradient(circle, rgba(142, 84, 233, 0.14) 0%, rgba(6, 7, 9, 0) 60%);
            --accent: #C58BFF;
            --accent-2: #8E54E9;
            --ctrl-bg: rgba(255, 255, 255, 0.07);
            --ctrl-bg-hover: rgba(255, 255, 255, 0.16);
            --ctrl-border: rgba(255, 255, 255, 0.14);
            --scroll-thumb: rgba(255, 255, 255, 0.14);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            margin: 0;
            padding: 0;
            transition: background-color 0.7s cubic-bezier(0.4, 0, 0.2, 1), color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: var(--glow);
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: background 0.9s ease-in-out;
            pointer-events: none;
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .slot-window {
            position: relative;
            height: 1.2em;
            width: 4em;
            overflow: hidden;
            transition: width 0.8s cubic-bezier(0.2, 0, 0, 1);
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
        }

        #card-shift {
            transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1);
            will-change: transform;
        }

        .slot-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            color: var(--text-faint);
        }
        .slot-item.active { opacity: 1; transform: translateY(0); color: var(--text); }
        .slot-item.prev { opacity: 0; transform: translateY(-100%); }
        .slot-item.next { opacity: 0; transform: translateY(100%); }

        .card-container {
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.6s ease, background 0.7s ease, border-color 0.7s ease;
            transform: scale(0.9) translateX(40px) rotateY(-10deg);
            opacity: 0;
            pointer-events: none;
            background: var(--surface);
            border: 1px solid var(--surface-border);
        }
        .card-container.visible {
            transform: scale(1) translateX(0) rotateY(0deg) rotateX(0deg);
            opacity: 1;
            pointer-events: auto;
        }
        .card-container.interactive {
            transition: transform 0.1s ease-out, opacity 0.4s ease, box-shadow 0.6s ease, background 0.7s ease, border-color 0.7s ease;
        }

        .card-content {
            transform-origin: 50% 35%;
            transition: opacity 0.38s ease, transform 0.55s cubic-bezier(0.2, 0, 0, 1), filter 0.4s ease;
        }
        .card-content.folding {
            opacity: 0;
            transform: translateY(-12px) scaleY(0.5) scaleX(0.94);
            filter: blur(7px);
        }

        #left-anchor {
            transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1), opacity 0.8s ease;
            transform-origin: center center;
        }
        #left-anchor.shifted { transform: translateY(-5vh) scale(0.65); opacity: 0.95; }

        @media (min-width: 768px) {
            #left-anchor { transform-origin: left center; }
            #left-anchor.shifted { transform: translate(-10vw, -10vh) scale(0.65); }
        }

        #slots-wrapper { transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1); }
        #left-anchor.shifted #slots-wrapper { transform: translate(-4.35em, 1.3em); }
        #left-anchor.shifted .scroll-indicator { opacity: 0 !important; transition: opacity 0.4s ease; }

        #expanded-view {
            position: fixed;
            z-index: 50;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 1.5rem;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #expanded-view.active {
            opacity: 1;
            pointer-events: auto;
            top: 20vh !important;
            left: 5vw !important;
            width: 90vw !important;
            height: 75vh !important;
            border-radius: 2rem !important;
        }
        @media (min-width: 768px) {
            #expanded-view.active {
                top: 5vh !important;
                left: 42vw !important;
                width: 54vw !important;
                height: 90vh !important;
            }
        }

        .expanded-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0, 0, 1);
            transition-delay: 0s;
        }
        #expanded-view.active .expanded-content { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }

        .project-tile {
            background: var(--tile);
            border: 1px solid var(--tile-border);
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), background 0.3s ease, border-color 0.3s ease;
        }
        .project-tile:hover {
            transform: translateY(-8px);
            background: var(--tile-hover);
            border-color: var(--surface-border);
        }

        .status-badge {
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
            white-space: nowrap;
        }
        .tag {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 0.24rem 0.6rem;
            border-radius: 0.5rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--tile-border);
        }
        .tile-link {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.25s ease;
            word-break: break-all;
        }
        .tile-link:hover { opacity: 1; text-decoration: underline; }
        .empty-state {
            border: 1px dashed var(--surface-border);
            border-radius: 1rem;
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-faint);
            font-size: 1rem;
        }

        #expanded-grid::-webkit-scrollbar { width: 6px; display: block; }
        #expanded-grid::-webkit-scrollbar-track { background: transparent; }
        #expanded-grid::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
        ::-webkit-scrollbar { display: none; }

        .controls {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 80;
            display: flex;
            gap: 0.6rem;
        }
        .ctrl-btn {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ctrl-bg);
            border: 1px solid var(--ctrl-border);
            color: var(--text);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: background 0.3s ease, transform 0.3s cubic-bezier(0.2, 0, 0, 1), border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:hover { background: var(--ctrl-bg-hover); transform: translateY(-2px); }
        .ctrl-btn:active { transform: translateY(0) scale(0.94); }
        .ctrl-btn svg { width: 1.15rem; height: 1.15rem; }
        .theme-icon-dark { display: none; }
        html.theme-dark .theme-icon-dark { display: block; }
        html.theme-dark .theme-icon-light { display: none; }

        #lang-veil {
            position: fixed;
            inset: 0;
            z-index: 70;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>

                        desc: {

                            ru: 'Передовой VPN-сервис для обхода региональных ограничений с поддержкой 10+ стран и режимами работы в условиях максимальных ограничений.'
                        }
                    },
                    {
                        title: 'Meshtastic Node',
                        status: { en: 'Running', ru: 'Работает' },
                        tags: ['Mesh', 'LoRa', 'Off-grid'],
                        desc: {
                            en: 'A self-hosted Meshtastic node - long-range, off-grid mesh communication that keeps working when conventional networks do not.',
                            ru: 'Собственная Meshtastic-нода - дальняя автономная mesh-связь, которая продолжает работать там, где обычные сети недоступны.'
                        }
                    },
                    {
                        title: 'RadiusBranch',
                        status: { en: 'In development', ru: 'В разработке' },
                        tags: ['Python', 'Web UI', 'Geo'],
                        desc: {
                            en: 'A locally-run Python toolkit with a web interface that calculates how far a person could have travelled in a given time. Factors in airports, personal transport, kick-scooter sharing, metro and public transport - including train, commuter-rail and flight schedules.',
                            ru: 'Локально запускаемый пакет Python-скриптов с веб-интерфейсом для расчёта, за сколько и насколько максимально мог отдалиться человек. Учитывает аэропорты, личный транспорт, кикшеринги, метро и общественный транспорт - включая рейсы поездов, электричек и самолётов.'
                        }
                    }
                ]
            },
            {
                id: 'experiments',
                word: { en: 'Experiments', ru: 'Эксперименты' },
                title: { en: 'Experiments', ru: 'Эксперименты' },
                desc: {
                    en: 'Working at the edge of new technology. Built from scratch - prototypes, unconventional approaches, and solutions that do not exist yet.',
                    ru: 'Работаем на острие новых технологий. Разработка с нуля - прототипы, нестандартные подходы и решения, которых ещё нет.'
                },
                projects: [
                    {
                        title: 'Triangulation Spoofer',
                        status: { en: 'Prototype', ru: 'Прототип' },
                        tags: ['Hardware', 'RF', 'Privacy'],
                        desc: {
                            en: 'Designing and building a custom device that spoofs cellular tower triangulation - engineered for maximum anonymity while staying fully mobile.',
                            ru: 'Собственное проектирование и сборка прибора для подмены триангуляции сотовых вышек - для максимальной анонимности, оставаясь при этом мобильным.'
                        }
                    }
                ]
            },
            {
                id: 'media',
                word: { en: 'Media', ru: 'Медиа' },
                title: { en: 'Media', ru: 'Медиа' },
                desc: {
                    en: 'Every media direction. Filming, editing, motion, and visual content - whatever the story needs, end to end.',
                    ru: 'Любые медиа-направления. Съёмка, монтаж, движение и визуальный контент - всё, что нужно истории, от и до.'
                },
                projects: []
            },
            {
                id: 'signature',
                word: { en: 'Signature', ru: 'Сигнатура' },
                title: { en: 'Signature', ru: 'Сигнатура' },
                desc: {
                    en: 'Personal work for ourselves and the team. Passion projects with a distinct signature and no compromises.',
                    ru: 'Личные проекты для себя и команды. Работы с характером и собственным почерком, без компромиссов.'
                },
                projects: [
                    {
                        title: { en: 'Main Site', ru: 'Основной сайт' },
                        status: { en: 'Live', ru: 'Живой' },
                        tags: ['React', 'SPA'],
                        url: 'https://avthsr.space',
                        desc: {
                            en: 'The flagship portfolio everything redirects to - the primary home of the whole project.',
                            ru: 'Флагманский сайт-портфолио, на который всё редиректит, - основной дом всего проекта.'
                        }
                    },
                    {
                        title: { en: 'Web 1.0 Edition', ru: 'Версия Web 1.0' },
                        status: { en: 'Live', ru: 'Живой' },
                        tags: ['Retro', 'Nostalgia'],
                        url: 'https://old.avthsr.space',
                        desc: {
                            en: 'A nostalgic Web 1.0 rendition of the site - tables, blink tags and all.',
                            ru: 'Ностальгическая Web 1.0 версия сайта - для настроения тех времён.'
                        }
                    },
                    {
                        title: { en: 'Classified', ru: 'Засекречено' },
                        status: { en: 'Hidden', ru: 'Скрыто' },
                        tags: ['???'],
                        desc: {
                            en: 'And plenty more we cannot talk about just yet.',
                            ru: 'И много чего, о чём мы пока не можем рассказать.'
                        }
                    }
                ]
            }
        ];

        let currentIndex = 0;
        let currentLang = 'en';
        let isAnimating = false;
        let isExpanded = false;
        let isWiping = false;
        const animationCooldown = 800;

        const slotsWrapper = document.getElementById('slots-wrapper');
        const cardContainer = document.getElementById('project-card');
        const cardContent = cardContainer.querySelector('.card-content');
        const cardSubtitle = cardContainer.querySelector('.card-subtitle');
        const cardTitle = cardContainer.querySelector('.card-title');
        const cardDesc = cardContainer.querySelector('.card-desc');
        const mainEl = document.querySelector('main');

        function init() {
            slotsWrapper.innerHTML = '';
            sections.forEach((sec, index) => {
                const el = document.createElement('div');
                el.className = `slot-item ${index === 0 ? 'active' : 'next'} font-light tracking-wide`;
                el.textContent = sec.word[currentLang];
                slotsWrapper.appendChild(el);
            });
            updateUI(0, true);
            setTimeout(() => cardContainer.classList.add('interactive'), 800);
        }

        function measureWord(text) {
            const probe = document.createElement('div');
            probe.className = 'slot-item font-light tracking-wide';
            probe.style.cssText = 'position:absolute;visibility:hidden;width:auto;white-space:nowrap;transition:none;opacity:0;';
            probe.textContent = text;
            slotsWrapper.appendChild(probe);
            const w = probe.scrollWidth;
            slotsWrapper.removeChild(probe);
            return w;
        }

        function fitSlots() {
            const widths = sections.map(s => measureWord(s.word[currentLang]));
            const maxW = Math.min(Math.max(...widths) + 4, Math.min(window.innerWidth * (window.innerWidth >= 768 ? 0.42 : 0.62), 560));
            slotsWrapper.style.width = maxW + 'px';
            const curW = Math.min(widths[currentIndex] + 4, maxW);
            const shift = document.getElementById('card-shift');
            if (shift) shift.style.transform = window.innerWidth >= 768 ? `translateX(${-(maxW - curW)}px)` : 'none';
        }

        function updateUI(index, isInitial = false) {
            const data = sections[index];
            Array.from(slotsWrapper.children).forEach((child, i) => {
                child.classList.remove('active', 'prev', 'next');
                if (i === index) child.classList.add('active');
                else if (i < index) child.classList.add('prev');
                else child.classList.add('next');
            });
            fitSlots();

            if (isInitial) {
                updateCardContent(data);
                setTimeout(() => cardContainer.classList.add('visible'), 600);
                return;
            }

            cardContent.classList.add('folding');
            setTimeout(() => {
                updateCardContent(data);
                cardContent.classList.remove('folding');
            }, 380);
        }

        function updateCardContent(data) {
            cardSubtitle.textContent = `0${currentIndex + 1} / ${data.id}`;
            cardTitle.textContent = data.title[currentLang];
            cardDesc.textContent = data.desc[currentLang];
        }

        function handleScroll(direction) {
            if (isAnimating || isExpanded || isWiping) return;
            if (direction > 0 && currentIndex < sections.length - 1) { currentIndex++; triggerChange(); }
            else if (direction < 0 && currentIndex > 0) { currentIndex--; triggerChange(); }
        }

        function triggerChange() {
            isAnimating = true;
            updateUI(currentIndex);
            setTimeout(() => { isAnimating = false; }, animationCooldown);
        }

        cardContainer.addEventListener('mousemove', (e) => {
            if (!cardContainer.classList.contains('visible') || !cardContainer.classList.contains('interactive')) return;
            const rect = cardContainer.getBoundingClientRect();
            const rotateX = (((e.clientY - rect.top) - rect.height / 2) / (rect.height / 2)) * -8;
            const rotateY = (((e.clientX - rect.left) - rect.width / 2) / (rect.width / 2)) * 8;
            cardContainer.style.transform = `scale(1) perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        cardContainer.addEventListener('mouseleave', () => {
            if (!cardContainer.classList.contains('visible')) return;
            cardContainer.style.transform = `scale(1) perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });

        window.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > 20) handleScroll(e.deltaY); });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => touchStartY = e.changedTouches[0].screenY, { passive: true });
        window.addEventListener('touchend', (e) => {
            const diff = touchStartY - e.changedTouches[0].screenY;
            if (Math.abs(diff) > 50) handleScroll(diff);
        }, { passive: true });

        const exploreBtn = document.getElementById('explore-btn');
        const expandedView = document.getElementById('expanded-view');
        const closeExpandedBtn = document.getElementById('close-expanded');
        const expandedGrid = document.getElementById('expanded-grid');
        const expandedTitle = expandedView.querySelector('.expanded-title');
        const leftAnchor = document.getElementById('left-anchor');

        function tx(v) { return (v && typeof v === 'object') ? (v[currentLang] ?? v.en) : v; }

        function renderGrid(data) {
            if (!data.projects || data.projects.length === 0) {
                const msg = currentLang === 'ru' ? 'Пока пусто. Скоро здесь появятся работы.' : 'Nothing here yet. Work is on the way.';
                expandedGrid.innerHTML = `<div class="empty-state md:col-span-2">${msg}</div>`;
                return;
            }
            expandedGrid.innerHTML = data.projects.map(p => {
                const title = tx(p.title);
                const status = p.status ? tx(p.status) : '';
                const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                const link = p.url
                    ? `<a href="https://explore.avthsr.space/${p.url}" target="_blank" rel="noreferrer" class="tile-link">${p.url.replace(/^https?:\/\//, '')}</a>`
                    : '';
                return `
                <div class="project-tile group flex flex-col p-7">
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <h3 class="text-2xl font-semibold" style="color: var(--text);">${title}</h3>
                        ${status ? `<span class="status-badge shrink-0">${status}</span>` : ''}
                    </div>
                    <p class="text-base leading-relaxed mb-5" style="color: var(--text-muted);">${tx(p.desc)}</p>
                    <div class="mt-auto flex flex-col gap-3">
                        ${tags ? `<div class="flex flex-wrap gap-2">${tags}</div>` : ''}
                        ${link}
                    </div>
                </div>`;
            }).join('');
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isExpanded) closeExpandedBtn.click(); });

        exploreBtn.addEventListener('click', () => {
            if (isExpanded) return;
            isExpanded = true;
            const rect = cardContainer.getBoundingClientRect();
            expandedView.style.transition = 'none';
            expandedView.style.top = rect.top + 'px';
            expandedView.style.left = rect.left + 'px';
            expandedView.style.width = rect.width + 'px';
            expandedView.style.height = rect.height + 'px';
            expandedView.style.borderRadius = '1.5rem';
            expandedView.style.opacity = '1';

            const data = sections[currentIndex];
            expandedTitle.textContent = `${data.title[currentLang]} - ${UI[currentLang].projects}`;
            renderGrid(data);

            requestAnimationFrame(() => requestAnimationFrame(() => {
                cardContainer.style.opacity = '0';
                leftAnchor.classList.add('shifted');
                expandedView.style.transition = 'all 0.6s cubic-bezier(0.2, 0, 0, 1)';
                expandedView.classList.add('active');
            }));
        });

        closeExpandedBtn.addEventListener('click', () => {
            if (!isExpanded) return;
            const rect = cardContainer.getBoundingClientRect();
            expandedView.classList.remove('active');
            leftAnchor.classList.remove('shifted');
            expandedView.style.top = rect.top + 'px';
            expandedView.style.left = rect.left + 'px';
            expandedView.style.width = rect.width + 'px';
            expandedView.style.height = rect.height + 'px';
            expandedView.style.borderRadius = '1.5rem';
            setTimeout(() => {
                isExpanded = false;
                cardContainer.style.opacity = '1';
                expandedView.style.opacity = '0';
                expandedView.style.top = '-9999px';
                expandedGrid.innerHTML = '';
            }, 600);
        });

        function translateTree(root, lang) {
            const slots = root.querySelectorAll('.slot-item');
            slots.forEach((el, i) => { if (sections[i]) el.textContent = sections[i].word[lang]; });
            const data = sections[currentIndex];
            const t = root.querySelector('.card-title'); if (t) t.textContent = data.title[lang];
            const d = root.querySelector('.card-desc'); if (d) d.textContent = data.desc[lang];
            const s = root.querySelector('.card-subtitle'); if (s) s.textContent = `0${currentIndex + 1} / ${data.id}`;
            root.querySelectorAll('[data-ui]').forEach(el => { el.textContent = UI[lang][el.getAttribute('data-ui')]; });
            const et = root.querySelector('.expanded-title');
            if (et && isExpanded) et.textContent = `${data.title[lang]} - ${UI[lang].projects}`;
        }

        function applyLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            translateTree(document, lang);
            document.getElementById('lang-label').textContent = lang.toUpperCase();
            fitSlots();
            if (isExpanded) renderGrid(sections[currentIndex]);
        }

        const langBtn = document.getElementById('lang-btn');
        const veil = document.getElementById('lang-veil');

        langBtn.addEventListener('click', () => {
            if (isWiping) return;
            const nextLang = currentLang === 'en' ? 'ru' : 'en';
            const r = langBtn.getBoundingClientRect();
            const ox = r.left + r.width / 2;
            const oy = r.top + r.height / 2;
            const maxR = Math.hypot(Math.max(ox, window.innerWidth - ox), Math.max(oy, window.innerHeight - oy));

            const clone = mainEl.cloneNode(true);
            clone.removeAttribute('id');
            clone.style.position = 'absolute';
            clone.style.inset = '0';
            clone.style.margin = '0 auto';
            clone.style.pointerEvents = 'none';
            translateTree(clone, nextLang);

            veil.innerHTML = '';
            veil.appendChild(clone);
            clone.style.clipPath = `circle(0px at ${ox}px ${oy}px)`;
            clone.style.webkitClipPath = `circle(0px at ${ox}px ${oy}px)`;

            isWiping = true;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                clone.style.transition = 'clip-path 0.85s cubic-bezier(0.4, 0, 0.2, 1), -webkit-clip-path 0.85s cubic-bezier(0.4, 0, 0.2, 1)';
                clone.style.clipPath = `circle(${maxR}px at ${ox}px ${oy}px)`;
                clone.style.webkitClipPath = `circle(${maxR}px at ${ox}px ${oy}px)`;
            }));

            setTimeout(() => {
                applyLang(nextLang);
                veil.innerHTML = '';
                isWiping = false;
            }, 900);
        });

        const themeBtn = document.getElementById('theme-btn');
        function applyTheme(theme) {
            document.documentElement.classList.toggle('theme-dark', theme === 'dark');
            try { localStorage.setItem('avr.theme', theme); } catch (e) {}
        }
        themeBtn.addEventListener('click', () => {
            const next = document.documentElement.classList.contains('theme-dark') ? 'light' : 'dark';
            applyTheme(next);
        });

        try {
            const saved = localStorage.getItem('avr.theme');
            if (saved === 'dark') document.documentElement.classList.add('theme-dark');
        } catch (e) {}

        window.addEventListener('resize', fitSlots);
        window.onload = init;
    </script>
</body>
</html>
