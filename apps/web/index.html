<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4248" />
    <!-- the two font files every page needs (Latin + Cyrillic, ~120 KB together); self-hosted, cached by the service worker -->
    <link rel="preload" href="/fonts/gsf-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rf-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AVRmusic — ваш музыкальный сервис: поиск, стриминг, скачивание, плейлисты, тексты и канвасы" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>AVRmusic</title>
  </head>
  <body>
    <!-- Tailwind 4 + M3E need a 2023+ engine (color-mix, :has, aspect-ratio). Older browsers get a warning instead of a broken layout. -->
    <div id="compat" hidden style="padding:12px 16px;background:#8c1d18;color:#fff;font:14px/1.4 system-ui,sans-serif;text-align:center">
      Ваш браузер устарел и не поддерживает современный CSS — интерфейс будет отображаться неправильно.
      Обновите Chrome, Edge, Firefox или Яндекс.Браузер до последней версии.
    </div>
    <script>
      try {
        var ok = window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in oklab, red, blue)') && CSS.supports('selector(:has(a))') && CSS.supports('aspect-ratio', '1 / 1');
        if (!ok) document.getElementById('compat').hidden = false;
      } catch (e) { document.getElementById('compat').hidden = false; }
    </script>
    <m3e-theme id="root" color="#6750A4" variant="expressive" scheme="dark" motion="expressive" strong-focus></m3e-theme>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
