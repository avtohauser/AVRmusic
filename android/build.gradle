// AVRmusic: the app (shared by Android and iOS, Compose Multiplatform) for https://music.avthsr.space;
// the Android app module adds its own Media3 player service.
plugins {
  id 'com.android.application' version '8.13.2' apply false
  id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
  id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
  id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21' apply false
  // the shared app (Android + iOS): Kotlin Multiplatform with Compose Multiplatform
  id 'org.jetbrains.kotlin.multiplatform' version '2.2.21' apply false
  id 'com.android.library' version '8.13.2' apply false
  id 'org.jetbrains.compose' version '1.11.1' apply false
}
