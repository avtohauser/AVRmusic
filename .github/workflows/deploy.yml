# Deploys the current branch to the production server over SSH. The runner copies the source tree,
# so the server needs no access to this (private) repository.
# Repository secrets: SERVER_HOST (IP or domain), SERVER_USER (root), SERVER_PASSWORD (or SERVER_SSH_KEY).
# Repository variable: DOMAIN (e.g. music.avthsr.space). Runs on push to the deploy branch or manually.
name: deploy
on:
  push:
    branches: [claude/music-service-streaming-nfpgvx, main]
  workflow_dispatch:
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host and user
        env:
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # Secrets are often pasted with labels or stray whitespace ("IP: 1.2.3.4", "root@host", a
          # trailing newline). Extract the first IP/hostname; fall back to DOMAIN when it does not resolve.
          pick_host() { printf '%s' "$1" | tr -d '\r' | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | head -n1 || true; }
          host="$(pick_host "$RAW_HOST")"
          if [ -z "$host" ] || ! getent ahostsv4 "$host" >/dev/null 2>&1; then
            echo "::warning::SERVER_HOST is empty or does not resolve, deploying to DOMAIN instead"
            host="$(pick_host "$DOMAIN")"
          fi
          getent ahostsv4 "$host" >/dev/null 2>&1 || { echo "::error::cannot resolve target host"; exit 1; }
          user="$(printf '%s' "$RAW_USER" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/.*[[:space:]:]//; s/@.*//')"
          echo "TARGET_HOST=$host" >> "$GITHUB_ENV"
          echo "TARGET_USER=${user:-root}" >> "$GITHUB_ENV"
          # The server gets a plain source tree (no clone), so the installer never talks to GitHub.
          rm -rf .git

      - name: Copy source to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.TARGET_HOST }}
          username: ${{ env.TARGET_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: /opt/avrmusic
          rm: false
          overwrite: true

      - name: Install / update and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.TARGET_HOST }}
          username: ${{ env.TARGET_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            export APP_DIR=/opt/avrmusic BRANCH="${{ github.ref_name }}"
            bash /opt/avrmusic/deploy/install.sh "${{ vars.DOMAIN }}"
