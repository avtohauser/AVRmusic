plugins { id 'com.android.application' }

// CI passes the version (package.json version + build number) and the signing key through the environment.
def versionCodeEnv = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
def versionNameEnv = System.getenv('APP_VERSION_NAME') ?: '0.1.0'
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
  namespace 'space.avthsr.music'
  compileSdk 34

  defaultConfig {
    applicationId 'space.avthsr.music'
    minSdk 21
    targetSdk 34
    versionCode versionCodeEnv
    versionName versionNameEnv
  }

  signingConfigs {
    release {
      if (keystoreFile) {
        storeFile file(keystoreFile)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS') ?: 'avrmusic'
        keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (keystoreFile) signingConfig signingConfigs.release
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  // the page runs in a WebView; music plays in a Media3 session service (notification-shade player with a Like button)
  // one Kotlin stdlib for everyone (older libraries pull kotlin-stdlib-jdk7/jdk8 1.6 next to 1.8: duplicate classes)
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
  implementation 'androidx.activity:activity:1.9.3'
  implementation 'androidx.core:core:1.13.1'
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
}
