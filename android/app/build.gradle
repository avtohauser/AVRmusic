plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

// CI passes the version (package.json version + build number) and the signing key through the environment.
def versionCodeEnv = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
def versionNameEnv = System.getenv('APP_VERSION_NAME') ?: '0.1.0'
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
  namespace 'space.avthsr.music'
  compileSdk 36

  defaultConfig {
    applicationId 'space.avthsr.music'
    minSdk 23
    targetSdk 34
    versionCode versionCodeEnv
    versionName versionNameEnv
  }

  signingConfigs {
    release {
      if (keystoreFile) {
        storeFile file(keystoreFile)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS') ?: 'avrmusic'
        keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (keystoreFile) signingConfig signingConfigs.release
    }
  }

  buildFeatures { buildConfig true; compose true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

kotlin {
  compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

dependencies {
  // native UI: Jetpack Compose + Material 3 Expressive (1.5 alphas carry the expressive components);
  // music: ExoPlayer in a Media3 session service (shade player with ♥)
  def compose = '1.11.0'
  implementation "androidx.compose.ui:ui:$compose"
  implementation "androidx.compose.foundation:foundation:$compose"
  implementation "androidx.compose.animation:animation:$compose"
  implementation 'androidx.compose.material3:material3:1.5.0-alpha17'
  implementation 'androidx.graphics:graphics-shapes:1.0.1'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.navigation:navigation-compose:2.8.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.media3:media3-exoplayer:1.4.1'
  implementation 'androidx.media3:media3-session:1.4.1'
  implementation 'androidx.media3:media3-datasource:1.4.1'
  implementation 'androidx.media3:media3-database:1.4.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'io.coil-kt:coil-compose:2.7.0'
}
