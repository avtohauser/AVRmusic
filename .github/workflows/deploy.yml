# Deploys the current branch to the production server over SSH.
# Add repository secrets: SERVER_HOST (IP or domain), SERVER_USER (root), SERVER_PASSWORD (or SERVER_SSH_KEY),
# and a variable DOMAIN (e.g. music.avthsr.space). Runs on push to the deploy branch or manually.
name: deploy
on:
  push:
    branches: [claude/music-service-streaming-nfpgvx, main]
  workflow_dispatch:
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DOMAIN != '' }}
    steps:
      - name: Install or update AVRmusic on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            export BRANCH="${{ github.ref_name }}"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/deploy/install.sh" -o /tmp/avr-install.sh
            bash /tmp/avr-install.sh "${{ vars.DOMAIN }}"
